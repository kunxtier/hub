[workspace]
resolver = "2"
members = [
    "crates/kunxtier-core",
    "crates/kunxtier-relay",
    "crates/kunxtier-cli",
    "crates/kunxtier-node",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
kunxtier-core = { path = "crates/kunxtier-core" }
kunxtier-relay = { path = "crates/kunxtier-relay" }
kunxtier-node = { path = "crates/kunxtier-node" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rcgen = "0.13"
rusqlite = { version = "0.37", features = ["bundled"] }
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
rand = "0.9"
base64 = "0.22"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
# WG 用户态引擎: gotatun 0.7.2 起 MSRV 1.95 超出当前工具链 (1.90), 升级工具链前锁定 0.7.1。
# default-features 关闭以排除 aws-lc-rs, ring 后端与 rustls 选型对齐。
gotatun = { version = "=0.7.1", default-features = false, features = ["ring", "device"] }
tun-rs = { version = "2.8", features = ["async"] }
# 与 gotatun 内 ipnetwork 同版本, 保证 Peer allowed_ips 类型一致
ipnetwork = "0.21"
# 本地接口枚举 (节点网段冲突检测)
if-addrs = "0.15"
# 集成测试侧: TLS WS 客户端 (client_async 走自带 TLS 流, 不启用其 TLS feature)
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
# feature 与 workspace rustls 对齐 (ring), 避免 aws-lc-rs 进入特性合成
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

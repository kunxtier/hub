[workspace]
resolver = "2"
members = ["crates/kunxtier-core", "crates/kunxtier-relay", "crates/kunxtier-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
kunxtier-core = { path = "crates/kunxtier-core" }
kunxtier-relay = { path = "crates/kunxtier-relay" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rcgen = "0.13"
rusqlite = { version = "0.37", features = ["bundled"] }
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
rand = "0.9"
base64 = "0.22"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
# 集成测试侧: TLS WS 客户端 (client_async 走自带 TLS 流, 不启用其 TLS feature)
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
# feature 与 workspace rustls 对齐 (ring), 避免 aws-lc-rs 进入特性合成
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
